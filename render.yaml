# Render Blueprint: one Docker web service. The database is Neon (not Render),
# so DATABASE_URL is entered by hand in the dashboard.
services:
  - type: web
    name: crease
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL        # Neon connection string (direct endpoint, sslmode=require)
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      # DEV_FAUCET_ENABLED is deliberately absent: it must stay unset in production.
      # SITE_PASSWORD is optional (off): set it only to close the whole site behind one password.
